<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1T1C DRAM 통합 시뮬레이터 (회로 & 밴드)</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121215; color: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #app-container {
            width: 900px; height: 600px;
            position: relative;
            background-color: #1a1a20;
            border: 1px solid #333; border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            margin-bottom: 20px;
        }
        h2 { text-align: center; margin-top: 10px; margin-bottom: 20px; color: #e0e0e0; font-weight: 400; }
        
        /* 실시간 상태 대시보드 */
        #status-dashboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.85); border: 1px solid #444;
            padding: 10px 25px; border-radius: 8px; z-index: 50;
            display: flex; gap: 30px; font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 1rem;
        }
        .status-item { display: flex; flex-direction: column; align-items: center; }
        .status-label { font-size: 0.8rem; color: #aaa; margin-bottom: 4px; }
        .status-value { font-weight: bold; }
        .color-off { color: #888; }
        .color-on { color: #2ed573; text-shadow: 0 0 8px rgba(46, 213, 115, 0.5); }
        .color-flow { color: #ffde59; text-shadow: 0 0 8px rgba(255, 222, 89, 0.5); }

        .view-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.6s ease-in-out;
        }
        
        /* 회로 뷰 전용 스타일 */
        #circuit-view { z-index: 10; opacity: 1; transform: scale(1); }
        .circuit-title { position: absolute; top: 20px; left: 20px; color: #4da8da; font-weight: bold; font-size: 1.1rem;}
        #mosfet-hitbox {
            position: absolute; width: 140px; height: 140px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            cursor: pointer; z-index: 20;
            border-radius: 50%; border: 2px dashed rgba(77, 168, 218, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; font-size: 0.85rem; color: #4da8da; background: rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        #mosfet-hitbox:hover { background: rgba(77, 168, 218, 0.2); border: 2px solid #4da8da; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(77, 168, 218, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(77, 168, 218, 0); }
            100% { box-shadow: 0 0 0 0 rgba(77, 168, 218, 0); }
        }
        
        /* 밴드 뷰 전용 스타일 */
        #band-view { z-index: 5; opacity: 0; transform: scale(0.5); pointer-events: none; }
        .band-title { position: absolute; top: 20px; left: 20px; color: #ff4757; font-weight: bold; font-size: 1.1rem;}
        #back-btn {
            position: absolute; top: 20px; right: 20px; padding: 8px 16px;
            background: #2b2b36; border: 1px solid #fff; color: #fff; border-radius: 5px;
            cursor: pointer; z-index: 20; transition: 0.3s;
        }
        #back-btn:hover { background: #444; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 통합 컨트롤 패널 */
        .controls {
            display: flex; gap: 40px; background: #1e1e24; padding: 20px 40px;
            border-radius: 12px; border: 1px solid #444; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 30;
        }
        .slider-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .slider-group label { font-weight: bold; color: #ddd; font-size: 0.9rem;}
        .desc { font-size: 0.75rem; color: #888; margin-top: -5px; }
        input[type="range"] { width: 220px; cursor: pointer; }
        #wl-slider { accent-color: #ff4757; }
        #bl-slider { accent-color: #1e90ff; }
        .val-display {
            font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; font-weight: bold;
            padding: 5px 15px; border-radius: 5px; background: #111; border: 1px solid #333;
        }
        #wl-val { color: #ff4757; } #bl-val { color: #1e90ff; }
    </style>
</head>
<body>

<h2>1T1C DRAM 종합 시뮬레이터 (회로 ↔ 에너지 밴드)</h2>

<div id="app-container">
    <div id="status-dashboard">
        <div class="status-item">
            <span class="status-label">문턱 전압 (V_th)</span>
            <span class="status-value" style="color: #fff;">1.0 V</span>
        </div>
        <div class="status-item">
            <span class="status-label">트랜지스터 상태</span>
            <span class="status-value color-off" id="t-status">OFF (WL < 1.0V)</span>
        </div>
        <div class="status-item">
            <span class="status-label">전류 (데이터) 흐름</span>
            <span class="status-value color-off" id="c-status">차단됨</span>
        </div>
    </div>

    <div id="circuit-view" class="view-layer">
        <div class="circuit-title">거시적 관점: 1T1C 회로</div>
        <canvas id="circuitCanvas" width="900" height="600"></canvas>
        <div id="mosfet-hitbox">
            <span style="font-weight:bold; margin-bottom:5px;">MOSFET</span>
            <span>클릭하여<br>내부 밴드 확인</span>
        </div>
    </div>

    <div id="band-view" class="view-layer">
        <div class="band-title">미시적 관점: N-P-N 에너지 밴드</div>
        <button id="back-btn">회로도로 돌아가기</button>
        <canvas id="bandCanvas" width="900" height="600"></canvas>
    </div>
</div>

<div class="controls">
    <div class="slider-group">
        <label>WL 전압 (Gate)</label>
        <div class="desc">V_th(1.0V) 이상일 때 스위치 ON (장벽 하강)</div>
        <input type="range" id="wl-slider" min="0" max="3" step="0.1" value="0">
        <div class="val-display"><span id="wl-val">0.0</span> V</div>
    </div>
    <div class="slider-group">
        <label>BL 전압 (Drain)</label>
        <div class="desc">전위차를 만들어 캐패시터로 전하(데이터) 공급</div>
        <input type="range" id="bl-slider" min="0" max="3" step="0.1" value="0">
        <div class="val-display"><span id="bl-val">0.0</span> V</div>
    </div>
</div>

<script>
    const circuitView = document.getElementById('circuit-view');
    const bandView = document.getElementById('band-view');
    const mosfetHitbox = document.getElementById('mosfet-hitbox');
    const backBtn = document.getElementById('back-btn');
    
    const wlSlider = document.getElementById('wl-slider');
    const blSlider = document.getElementById('bl-slider');
    const wlValDisplay = document.getElementById('wl-val');
    const blValDisplay = document.getElementById('bl-val');
    
    const tStatus = document.getElementById('t-status');
    const cStatus = document.getElementById('c-status');

    const circuitCtx = document.getElementById('circuitCanvas').getContext('2d');
    const bandCtx = document.getElementById('bandCanvas').getContext('2d');

    let state = {
        wl: 0,
        bl: 0,
        vTh: 1.0,  // 문턱 전압 명시적 설정
        charge: 0,
        view: 'circuit',
        particles: []
    };

    let bandParticles = [];

    // 상태 업데이트 로직 (UI 텍스트/색상 변경 포함)
    function updateState() {
        state.wl = parseFloat(wlSlider.value);
        state.bl = parseFloat(blSlider.value);
        wlValDisplay.innerText = state.wl.toFixed(1);
        blValDisplay.innerText = state.bl.toFixed(1);

        // 트랜지스터 ON/OFF 상태 업데이트
        let isON = state.wl >= state.vTh;
        if (isON) {
            tStatus.innerText = `ON (WL ≥ 1.0V)`;
            tStatus.className = 'status-value color-on';
        } else {
            tStatus.innerText = `OFF (WL < 1.0V)`;
            tStatus.className = 'status-value color-off';
        }

        // 전류 흐름 상태 업데이트
        if (isON && state.bl > 0) {
            cStatus.innerText = `흐름 진행 (Writing)`;
            cStatus.className = 'status-value color-flow';
        } else if (isON && state.bl === 0) {
            cStatus.innerText = `대기 (전위차 없음)`;
            cStatus.className = 'status-value color-off';
        } else {
            cStatus.innerText = `차단됨`;
            cStatus.className = 'status-value color-off';
        }
    }
    wlSlider.addEventListener('input', updateState);
    blSlider.addEventListener('input', updateState);

    // 뷰 전환
    mosfetHitbox.addEventListener('click', () => {
        state.view = 'band';
        circuitView.style.transform = 'scale(3)';
        circuitView.style.opacity = '0';
        circuitView.style.pointerEvents = 'none';
        
        bandView.style.transform = 'scale(1)';
        bandView.style.opacity = '1';
        bandView.style.pointerEvents = 'auto';
    });

    backBtn.addEventListener('click', () => {
        state.view = 'circuit';
        bandView.style.transform = 'scale(0.5)';
        bandView.style.opacity = '0';
        bandView.style.pointerEvents = 'none';
        
        circuitView.style.transform = 'scale(1)';
        circuitView.style.opacity = '1';
        circuitView.style.pointerEvents = 'auto';
    });

    // --- 회로 뷰 렌더링 ---
    class CircuitParticle {
        constructor() {
            this.progress = 0;
            this.speed = 0.015 + Math.random() * 0.01;
        }
        update() { this.progress += this.speed; }
        getPos() {
            if (this.progress < 0.3) return { x: 300, y: 100 + (this.progress / 0.3) * 200 };
            else if (this.progress < 0.7) return { x: 300 + ((this.progress - 0.3) / 0.4) * 300, y: 300 };
            else return { x: 600, y: 300 + ((this.progress - 0.7) / 0.3) * 150 };
        }
    }

    function drawCircuit() {
        if (state.view !== 'circuit') return;
        circuitCtx.clearRect(0, 0, 900, 600);

        // 배선
        circuitCtx.strokeStyle = '#888'; circuitCtx.lineWidth = 4; circuitCtx.lineCap = 'round';
        circuitCtx.beginPath();
        circuitCtx.moveTo(300, 100); circuitCtx.lineTo(300, 300);
        circuitCtx.moveTo(600, 300); circuitCtx.lineTo(600, 450);
        circuitCtx.moveTo(100, 320); circuitCtx.lineTo(400, 320);
        circuitCtx.stroke();

        // 캐패시터
        circuitCtx.strokeStyle = '#fff'; circuitCtx.beginPath();
        circuitCtx.moveTo(550, 450); circuitCtx.lineTo(650, 450);
        circuitCtx.moveTo(550, 480); circuitCtx.lineTo(650, 480);
        circuitCtx.moveTo(600, 480); circuitCtx.lineTo(600, 530);
        circuitCtx.stroke();
        
        // Ground
        circuitCtx.beginPath();
        circuitCtx.moveTo(570, 530); circuitCtx.lineTo(630, 530);
        circuitCtx.moveTo(585, 540); circuitCtx.lineTo(615, 540);
        circuitCtx.moveTo(595, 550); circuitCtx.lineTo(605, 550);
        circuitCtx.stroke();

        // 충전량 시각화
        if (state.charge > 0) {
            circuitCtx.fillStyle = 'rgba(30, 144, 255, 0.6)';
            let fillHeight = (state.charge / 100) * 30;
            circuitCtx.fillRect(550, 480 - fillHeight, 100, fillHeight);
        }

        // 라벨
        circuitCtx.fillStyle = '#fff'; circuitCtx.font = '18px Arial';
        circuitCtx.fillText('BL (Drain)', 260, 80);
        circuitCtx.fillText('WL (Gate)', 100, 300);
        circuitCtx.fillText('Capacitor', 670, 470);

        // MOSFET 기호 시각화 (ON/OFF 명확히)
        let isON = state.wl >= state.vTh;
        circuitCtx.strokeStyle = isON ? '#2ed573' : '#ff4757'; // ON: 초록, OFF: 빨강
        circuitCtx.beginPath();
        circuitCtx.moveTo(300, 300); circuitCtx.lineTo(400, 300);
        circuitCtx.moveTo(400, 270); circuitCtx.lineTo(400, 330);
        circuitCtx.moveTo(420, 270); circuitCtx.lineTo(420, 330);
        circuitCtx.moveTo(400, 300); circuitCtx.lineTo(600, 300);
        circuitCtx.stroke();

        // MOSFET 옆 상태 텍스트
        circuitCtx.font = 'bold 16px Arial';
        if (isON) {
            circuitCtx.fillStyle = '#2ed573';
            circuitCtx.fillText(`[ ON ] 장벽 하강`, 375, 250);
        } else {
            circuitCtx.fillStyle = '#ff4757';
            circuitCtx.fillText(`[ OFF ] 장벽 차단`, 370, 250);
        }

        // 동작 논리: Vth를 넘었을 때만 충/방전 가능
        let maxChargeForBL = (state.bl / 3.0) * 100;
        
        if (isON && state.bl > 0 && state.charge < maxChargeForBL) {
            state.charge += 0.5;
            if (state.charge > maxChargeForBL) state.charge = maxChargeForBL;
            if (Math.random() < 0.4) state.particles.push(new CircuitParticle());
        } else if (isON && state.charge > maxChargeForBL) {
            state.charge -= 0.5; // BL 전압이 캐패시터 전압보다 낮아지면 전하가 빠져나감
        }

        for (let i = state.particles.length - 1; i >= 0; i--) {
            let p = state.particles[i];
            p.update();
            if (p.progress >= 1) state.particles.splice(i, 1);
            else {
                let pos = p.getPos();
                circuitCtx.beginPath(); circuitCtx.arc(pos.x, pos.y, 5, 0, Math.PI * 2);
                circuitCtx.fillStyle = '#ffde59'; circuitCtx.fill();
            }
        }
    }

    // --- 밴드 뷰 렌더링 ---
    class BandParticle {
        constructor(x, getEcYFunc) {
            this.x = x; this.getEcY = getEcYFunc;
            this.y = this.getEcY(this.x) - 10 - Math.random() * 10;
            this.speed = 3 + Math.random() * 3;
        }
        update() {
            this.x += this.speed;
            this.y = this.getEcY(this.x) - 10 - Math.random() * 5;
        }
        draw(ctx) {
            ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
            ctx.fillStyle = '#ffde59'; ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillRect(this.x - 2, this.y - 0.5, 4, 1);
        }
    }

    function drawBand() {
        if (state.view !== 'band') return;
        bandCtx.clearRect(0, 0, 900, 600);

        const w = 900, h = 600;
        const x1 = w * 0.25, x2 = w * 0.75;
        const baseY = 250, maxBarrierHeight = 120, bandGap = 130, efOffset = 25;

        // 배경
        bandCtx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        bandCtx.fillRect(0, 0, x1, h); bandCtx.fillRect(x2, 0, w - x2, h);
        bandCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        bandCtx.fillRect(x1, 0, x2 - x1, h);

        bandCtx.fillStyle = '#aaa'; bandCtx.font = '18px Arial'; bandCtx.textAlign = 'center';
        bandCtx.fillText('Source', x1/2, 90); bandCtx.fillText('Channel', w/2, 90); bandCtx.fillText('Drain', w - (w-x2)/2, 90);

        const drainDrop = state.bl * 50; 
        const drainY = baseY + drainDrop;
        
        // Vth 로직 적용: WL이 Vth(1.0)에 도달하면 장벽이 전자가 넘을 수 있는 수준(maxBarrierHeight의 80% 하강)이 되도록 수식 조정
        // WL=0 -> barrier = max
        // WL=1.0 (Vth) -> barrier 거의 하강
        // WL=3.0 -> barrier 완전 하강 (0)
        let barrierRatio = 1.0;
        if (state.wl >= state.vTh) {
            barrierRatio = Math.max(0, 0.2 - ((state.wl - state.vTh) / 2.0) * 0.2); 
        } else {
            barrierRatio = 1.0 - (state.wl / state.vTh) * 0.8;
        }
        let currentBarrierHeight = maxBarrierHeight * barrierRatio;

        const getEcY = (x, isOriginal = false) => {
            let tDrainY = isOriginal ? baseY : drainY;
            let tBarrier = isOriginal ? maxBarrierHeight : currentBarrierHeight;
            
            if (x <= x1) return baseY;
            if (x >= x2) return tDrainY;
            
            let ratio = (x - x1) / (x2 - x1);
            const smoothstep = (t) => Math.max(0, Math.min(1, t)) * Math.max(0, Math.min(1, t)) * (3 - 2 * Math.max(0, Math.min(1, t)));

            let channelStartY = baseY - tBarrier;
            let channelEndY = channelStartY + (tDrainY - baseY) * 0.1;

            if (ratio < 0.25) return baseY - smoothstep(ratio / 0.25) * tBarrier;
            else if (ratio > 0.75) return channelEndY + smoothstep((ratio - 0.75) / 0.25) * (tDrainY - channelEndY);
            else return channelStartY + ((ratio - 0.25) / 0.5) * (channelEndY - channelStartY);
        };

        const drawLine = (yOff, color, width, isDashed=false, isOrig=false) => {
            bandCtx.beginPath(); bandCtx.moveTo(0, getEcY(0, isOrig) + yOff);
            for(let x=0; x<=w; x+=3) bandCtx.lineTo(x, getEcY(x, isOrig) + yOff);
            bandCtx.strokeStyle = color; bandCtx.lineWidth = width;
            bandCtx.setLineDash(isDashed ? [8, 8] : []); bandCtx.stroke(); bandCtx.setLineDash([]);
        };

        // 참조선
        if (state.wl > 0 || state.bl > 0) {
            drawLine(0, 'rgba(255, 255, 255, 0.1)', 2, false, true);
            drawLine(bandGap, 'rgba(255, 255, 255, 0.1)', 2, false, true);
        }

        // 현재 밴드 (ON이면 초록색 포인트, OFF면 기본)
        let isON = state.wl >= state.vTh;
        let bandColor = isON ? '#2ed573' : (state.wl > 0 ? '#ff4757' : '#ffffff');
        drawLine(0, bandColor, 3);
        drawLine(bandGap, bandColor, 3);

        bandCtx.fillStyle = '#fff'; bandCtx.fillText('Ec', 30, baseY - 10); bandCtx.fillText('Ev', 30, baseY + bandGap - 10);

        // Ef
        bandCtx.beginPath();
        bandCtx.moveTo(0, baseY + efOffset); bandCtx.lineTo(x1, baseY + efOffset);
        bandCtx.moveTo(x2, drainY + efOffset); bandCtx.lineTo(w, drainY + efOffset);
        bandCtx.strokeStyle = '#aaa'; bandCtx.lineWidth = 1.5; bandCtx.setLineDash([5, 5]); bandCtx.stroke(); bandCtx.setLineDash([]);
        bandCtx.fillStyle = '#aaa'; bandCtx.fillText('Ef', 30, baseY + efOffset + 15);
        if(state.bl > 0) bandCtx.fillText('Ef', w - 30, drainY + efOffset + 15);

        // 전자
        const drawElecPyr = (cX, bY) => {
            let sY = bY - 15;
            const dE = (ex, ey) => {
                bandCtx.beginPath(); bandCtx.arc(ex, ey, 7, 0, Math.PI*2);
                bandCtx.fillStyle = '#000'; bandCtx.fill(); bandCtx.strokeStyle = '#fff'; bandCtx.lineWidth = 1.5; bandCtx.stroke();
            };
            dE(cX-25, sY); dE(cX, sY); dE(cX+25, sY);
            dE(cX-12.5, sY-20); dE(cX+12.5, sY-20); dE(cX, sY-40);
        };
        drawElecPyr(x1 / 2, baseY); drawElecPyr(w - (w - x2) / 2, drainY);

        // 화살표 및 상태 텍스트
        if (state.wl > 0) {
            let arrY = baseY - maxBarrierHeight + 20; let arrL = (state.wl / 3) * 40;
            bandCtx.beginPath(); bandCtx.moveTo(w/2, arrY); bandCtx.lineTo(w/2, arrY + arrL);
            bandCtx.moveTo(w/2 - 10, arrY + arrL - 10); bandCtx.lineTo(w/2, arrY + arrL); bandCtx.lineTo(w/2 + 10, arrY + arrL - 10);
            bandCtx.strokeStyle = bandColor; bandCtx.lineWidth = 3; bandCtx.stroke();
            
            bandCtx.fillStyle = bandColor; bandCtx.font = 'bold 16px Arial';
            if(isON) bandCtx.fillText(`ON 상태 (장벽 열림)`, w/2, arrY - 10);
            else bandCtx.fillText(`OFF 상태 (장벽 막힘)`, w/2, arrY - 10);
        }

        // 전류
        if (isON && state.bl > 0) {
            if (Math.random() < 0.6) bandParticles.push(new BandParticle(x1 - 20, getEcY));
        }
        for (let i = bandParticles.length - 1; i >= 0; i--) {
            bandParticles[i].update(); bandParticles[i].draw(bandCtx);
            if (bandParticles[i].x > w) bandParticles.splice(i, 1);
        }
    }

    function animate() {
        drawCircuit();
        drawBand();
        requestAnimationFrame(animate);
    }
    
    // 초기 상태 업데이트 반영
    updateState();
    animate();

</script>
</body>
</html>
