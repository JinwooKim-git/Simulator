<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAM Refresh Simulator</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #121215; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #app-container { width: 900px; height: 600px; position: relative; background-color: #1a1a20; border: 1px solid #333; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden; margin-bottom: 20px; }
        h2 { text-align: center; margin-top: 10px; color: #e0e0e0; }
        
        #status-dashboard { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 25, 0.9); border: 1px solid #444; padding: 10px 25px; border-radius: 8px; z-index: 50; display: flex; gap: 30px; font-family: monospace; }
        .status-item { display: flex; flex-direction: column; align-items: center; }
        .status-label { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
        .status-value { font-weight: bold; font-size: 1rem; }

        .view-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.6s ease-in-out; }
        #circuit-view { z-index: 10; opacity: 1; }
        #band-view { z-index: 5; opacity: 0; transform: scale(0.5); pointer-events: none; }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #mosfet-hitbox { position: absolute; width: 140px; height: 140px; top: 50%; left: 50%; transform: translate(-50%, -50%); cursor: pointer; z-index: 20; border-radius: 50%; border: 2px dashed rgba(77, 168, 218, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.85rem; color: #4da8da; background: rgba(0,0,0,0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(77, 168, 218, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(77, 168, 218, 0); } 100% { box-shadow: 0 0 0 0 rgba(77, 168, 218, 0); } }

        .controls { display: flex; gap: 30px; background: #1e1e24; padding: 15px 40px; border-radius: 12px; border: 1px solid #444; z-index: 30; align-items: center; }
        .slider-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        input[type="range"] { width: 180px; cursor: pointer; }
        #refresh-btn { padding: 10px 20px; background: #2ed573; border: none; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #refresh-btn:hover { background: #1fb15b; transform: scale(1.05); }
        #refresh-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<h2>DRAM 1T1C Refresh Simulator</h2>

<div id="app-container">
    <div id="status-dashboard">
        <div class="status-item">
            <span class="status-label">Charge Level</span>
            <span class="status-value" id="charge-text" style="color: #4da8da;">0%</span>
        </div>
        <div class="status-item">
            <span class="status-label">Data State</span>
            <span class="status-value" id="data-state" style="color: #888;">EMPTY</span>
        </div>
        <div class="status-item">
            <span class="status-label">Leakage</span>
            <span class="status-value" style="color: #ff4757;">Active (-0.1%/frame)</span>
        </div>
    </div>

    <div id="circuit-view" class="view-layer">
        <canvas id="circuitCanvas" width="900" height="600"></canvas>
        <div id="mosfet-hitbox">MOSFET<br>클릭하여 밴드 확인</div>
    </div>

    <div id="band-view" class="view-layer">
        <button id="back-btn" style="position:absolute; top:20px; right:20px; z-index:100; cursor:pointer;">Back</button>
        <canvas id="bandCanvas" width="900" height="600"></canvas>
    </div>
</div>

<div class="controls">
    <div class="slider-group">
        <label>WL Voltage (Gate)</label>
        <input type="range" id="wl-slider" min="0" max="3" step="0.1" value="0">
        <span id="wl-val">0.0V</span>
    </div>
    <div class="slider-group">
        <label>BL Voltage (Drain)</label>
        <input type="range" id="bl-slider" min="0" max="3" step="0.1" value="0">
        <span id="bl-val">0.0V</span>
    </div>
    <button id="refresh-btn">REFRESH (다시 충전)</button>
</div>

<script>
    const state = { wl: 0, bl: 0, charge: 0, vTh: 1.0, view: 'circuit', particles: [] };
    const wlSlider = document.getElementById('wl-slider');
    const blSlider = document.getElementById('bl-slider');
    const chargeText = document.getElementById('charge-text');
    const dataState = document.getElementById('data-state');
    const refreshBtn = document.getElementById('refresh-btn');
    const circuitCtx = document.getElementById('circuitCanvas').getContext('2d');
    const bandCtx = document.getElementById('bandCanvas').getContext('2d');

    // 리프레시 버튼: 강제 충전
    refreshBtn.addEventListener('click', () => {
        state.charge = 100;
        logRefresh();
    });

    function logRefresh() {
        console.log("Refresh triggered: Capacitor recharged to 100%");
    }

    wlSlider.addEventListener('input', (e) => {
        state.wl = parseFloat(e.target.value);
        document.getElementById('wl-val').innerText = state.wl.toFixed(1) + 'V';
    });
    blSlider.addEventListener('input', (e) => {
        state.bl = parseFloat(e.target.value);
        document.getElementById('bl-val').innerText = state.bl.toFixed(1) + 'V';
    });

    document.getElementById('mosfet-hitbox').addEventListener('click', () => {
        state.view = 'band';
        document.getElementById('circuit-view').style.opacity = '0';
        document.getElementById('band-view').style.opacity = '1';
        document.getElementById('band-view').style.pointerEvents = 'auto';
    });

    document.getElementById('back-btn').addEventListener('click', () => {
        state.view = 'circuit';
        document.getElementById('circuit-view').style.opacity = '1';
        document.getElementById('band-view').style.opacity = '0';
        document.getElementById('band-view').style.pointerEvents = 'none';
    });

    function draw() {
        if (state.view === 'circuit') {
            circuitCtx.clearRect(0,0,900,600);
            
            // 자연 방전 (Leakage) - 매 프레임마다 조금씩 감소
            if (state.charge > 0) state.charge -= 0.05; 
            if (state.charge < 0) state.charge = 0;

            // 충전 로직
            if (state.wl >= state.vTh && state.bl > 0) {
                let targetCharge = (state.bl / 3) * 100;
                if (state.charge < targetCharge) state.charge += 0.5;
            }

            // UI 업데이트
            chargeText.innerText = Math.round(state.charge) + "%";
            if (state.charge > 70) { dataState.innerText = "DATA '1'"; dataState.style.color = "#2ed573"; }
            else if (state.charge > 30) { dataState.innerText = "WEAKENING..."; dataState.style.color = "#ffbe76"; }
            else if (state.charge > 5) { dataState.innerText = "DANGER (DATA LOSS)"; dataState.style.color = "#ff4757"; }
            else { dataState.innerText = "EMPTY / '0'"; dataState.style.color = "#888"; }

            // 회로 그리기 (간략화)
            circuitCtx.strokeStyle = "#888"; circuitCtx.lineWidth = 4;
            circuitCtx.beginPath();
            circuitCtx.moveTo(300, 100); circuitCtx.lineTo(300, 300); // BL
            circuitCtx.moveTo(600, 300); circuitCtx.lineTo(600, 450); // to Cap
            circuitCtx.stroke();
            
            // Capacitor 애니메이션
            circuitCtx.fillStyle = "#333"; circuitCtx.fillRect(550, 450, 100, 10); // Plate
            circuitCtx.fillStyle = "#333"; circuitCtx.fillRect(550, 470, 100, 10); // Plate
            circuitCtx.fillStyle = "rgba(77, 168, 218, " + (state.charge/100) + ")";
            circuitCtx.fillRect(550, 460, 100, 10 * (state.charge/10)); // Charge visual
            
            // MOSFET
            circuitCtx.strokeStyle = state.wl >= state.vTh ? "#2ed573" : "#ff4757";
            circuitCtx.strokeRect(400, 270, 100, 60);
        }
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
